# Every push to main ships a release: one executable per operating system, published
# on GitHub and mirrored to SourceForge, which is where the README points users.
#
# Start the commit subject with, or include in it, "[skip release]" to land a change
# without releasing it. Only the subject line counts, so a commit body is free to
# mention the escape hatch without tripping it.
name: Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  SOURCEFORGE_PROJECT: sortmyshit

jobs:
  version:
    name: Pick the next version
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.next.outputs.release }}
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick the version this push releases
        id: next
        run: |
          # Read from the commit rather than from the event, so a manual run works
          # too, and only the subject line is looked at.
          subject=$(git log -1 --format=%s)

          case "$subject" in
            *"[skip release]"*)
              echo "release=false" >> "$GITHUB_OUTPUT"
              echo "No release: the commit asks to skip it." >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
          esac

          echo "release=true" >> "$GITHUB_OUTPUT"

          latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)

          # A commit may name the version it releases, for anything a patch bump does not
          # describe: "feat(thing): what it does [release 1.1.0]". Everything else is a
          # patch on the latest tag, which is the common case and needs no ceremony.
          named=$(printf '%s' "$subject" | sed -n 's/.*\[release \([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)\].*/\1/p')

          if [ -n "$named" ]; then
            version="$named"
          elif [ -z "$latest" ]; then
            version="1.0.0"
          else
            version=$(echo "${latest#v}" | awk -F. '{ print $1 "." $2 "." $3 + 1 }')
          fi

          # A named version that already exists would push assets into a published
          # release, so it stops here rather than half rewriting one.
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "::error::v$version is already tagged."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version, after ${latest:-no previous tag}." >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build for ${{ matrix.name }}
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 rather than latest: the AppImage then runs on the older glibc too.
          - name: Linux
            os: ubuntu-22.04
            platform: linux
          - name: Windows
            os: windows-latest
            platform: windows
          - name: macOS
            os: macos-latest
            platform: macos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check tkinter is available to the build
        # PyInstaller only warns when it cannot find tkinter, and ships a binary that
        # dies on startup, so the build stops here instead.
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Stamp the version into the build
        shell: bash
        # The app compares this against the latest release to know whether it is behind.
        # Left at its development value the check disables itself, so the assertion is
        # what stops a build shipping with no idea what version it is.
        run: |
          set -e
          sed -i.bak 's/^    CURRENT = ".*"/    CURRENT = "${{ needs.version.outputs.version }}"/' src/domain/entity/Version.py
          rm -f src/domain/entity/Version.py.bak
          python -c "from src.domain.entity.Version import Version; \
            assert Version.current().name == '${{ needs.version.outputs.version }}', Version.current().name; \
            assert not Version.current().is_development(); \
            print('stamped as', Version.current())"

      - name: Build the executable
        run: pyinstaller SortMyShit.spec --distpath=.packaged/dist --workpath=.packaged/build --clean --noconfirm

      - name: Package the AppImage
        if: matrix.platform == 'linux'
        env:
          ARCH: x86_64
          APPIMAGE: SortMyShit-${{ needs.version.outputs.version }}-x86_64.AppImage
        run: |
          set -e
          appdir=SortMyShit.AppDir
          mkdir -p artifacts
          mkdir -p "$appdir/usr/bin" "$appdir/usr/share/applications" "$appdir/usr/share/icons/hicolor/512x512/apps"

          cp .packaged/dist/SortMyShit "$appdir/usr/bin/SortMyShit"
          cp packaging/SortMyShit.desktop "$appdir/SortMyShit.desktop"
          cp packaging/SortMyShit.desktop "$appdir/usr/share/applications/SortMyShit.desktop"
          cp src/application/assets/icon.png "$appdir/SortMyShit.png"
          cp src/application/assets/icon.png "$appdir/usr/share/icons/hicolor/512x512/apps/SortMyShit.png"

          printf '%s\n' \
            '#!/bin/sh' \
            'exec "$(dirname "$(readlink -f "$0")")/usr/bin/SortMyShit" "$@"' > "$appdir/AppRun"
          chmod +x "$appdir/AppRun"

          curl -sSfL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

          # The runners have no FUSE, so appimagetool unpacks itself instead of mounting.
          ./appimagetool --appimage-extract-and-run "$appdir" "artifacts/$APPIMAGE"

      - name: Package the Windows executable
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          mkdir -p artifacts
          cp .packaged/dist/SortMyShit.exe "artifacts/SortMyShit-${{ needs.version.outputs.version }}-windows-x86_64.exe"

      - name: Package the macOS disk image
        if: matrix.platform == 'macos'
        run: |
          mkdir -p artifacts
          hdiutil create \
            -volname SortMyShit \
            -srcfolder .packaged/dist/SortMyShit.app \
            -ov -format UDZO \
            "artifacts/SortMyShit-${{ needs.version.outputs.version }}-macos-arm64.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: SortMyShit-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Publish the GitHub release
    needs: [ version, build ]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.version.outputs.tag }}" artifacts/* \
            --target "${{ github.sha }}" \
            --title "SortMyShit ${{ needs.version.outputs.tag }}" \
            --generate-notes

  sourceforge:
    name: Mirror to SourceForge
    needs: [ version, build, release ]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload the executables
        env:
          SOURCEFORGE_USER: ${{ secrets.SOURCEFORGE_USER }}
          SOURCEFORGE_SSH_KEY: ${{ secrets.SOURCEFORGE_SSH_KEY }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -e

          if [ -z "$SOURCEFORGE_USER" ] || [ -z "$SOURCEFORGE_SSH_KEY" ]; then
            echo "::warning::SOURCEFORGE_USER / SOURCEFORGE_SSH_KEY are not set, skipping the mirror."
            exit 0
          fi

          install -d -m 700 ~/.ssh
          printf '%s\n' "$SOURCEFORGE_SSH_KEY" > ~/.ssh/sourceforge
          chmod 600 ~/.ssh/sourceforge
          ssh-keyscan -H frs.sourceforge.net >> ~/.ssh/known_hosts 2>/dev/null

          rsync -avz -e "ssh -i ~/.ssh/sourceforge" artifacts/ \
            "$SOURCEFORGE_USER@frs.sourceforge.net:/home/frs/project/$SOURCEFORGE_PROJECT/v$VERSION/"

      - name: Point each platform at its own download
        env:
          SOURCEFORGE_API_KEY: ${{ secrets.SOURCEFORGE_API_KEY }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -e

          if [ -z "$SOURCEFORGE_API_KEY" ]; then
            echo "::warning::SOURCEFORGE_API_KEY is not set, the default downloads keep pointing at the previous release."
            exit 0
          fi

          # SourceForge answers 400 until it has indexed a file, which happens a moment
          # after rsync returns rather than as part of it. Hence the retries, and hence
          # the warning rather than a failure at the end: the files are already
          # mirrored, and this only decides what the big green button offers.
          set_default() {
            file="$1"
            shift

            url="https://sourceforge.net/projects/$SOURCEFORGE_PROJECT/files/v$VERSION/$file"
            defaults=""
            for platform in "$@"; do
              defaults="$defaults -d default=$platform"
            done

            attempt=1
            while [ "$attempt" -le 5 ]; do
              # shellcheck disable=SC2086
              response=$(curl -s -w '\n%{http_code}' -H "Accept: application/json" -X PUT \
                -d "api_key=$SOURCEFORGE_API_KEY" $defaults "$url")
              status=$(printf '%s' "$response" | tail -n 1)

              if [ "$status" = "200" ]; then
                echo "$file is now the default for: $*"
                return 0
              fi

              echo "attempt $attempt for $file: HTTP $status $(printf '%s' "$response" | sed '$d')"
              attempt=$((attempt + 1))
              [ "$attempt" -le 5 ] && sleep 20
            done

            echo "::warning::Could not set the default download for $file. It is mirrored either way; set it by hand from the SourceForge file manager."
          }

          set_default "SortMyShit-$VERSION-x86_64.AppImage" linux bsd solaris others
          set_default "SortMyShit-$VERSION-windows-x86_64.exe" windows
          set_default "SortMyShit-$VERSION-macos-arm64.dmg" mac
